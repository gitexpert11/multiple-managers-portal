[project]
name = "ads-campaign-api"
version = "1.0.0"
description = "Ads Campaign Management backend (FastAPI + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<2.1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:app.*",
  # Very recent Starlette releases warn about the httpx-based TestClient; harmless here.
  "ignore:Using `httpx` with `starlette.testclient`",
]
